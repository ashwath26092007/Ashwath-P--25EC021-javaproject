<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - Blood Donor System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>BloodLink</h1>
<p>Blood Donor Management System</p>

<hr>

<h2>Register as a Donor</h2>

<div class="form-box">

    <form id="donorForm">

        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Enter your age" min="18" max="65" required>

        <label for="bloodGroup">Blood Group:</label>
        <select id="bloodGroup" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <label for="city">City:</label>
        <input type="text" id="city" placeholder="Enter your city" required>

        <button type="submit" id="submitBtn">Register Donor</button>

    </form>

</div>

<h2>Search Donors</h2>

<div class="search-box">

    <input type="text" id="searchGroup" placeholder="Blood Group (e.g. A+)">

    <input type="text" id="searchCity" placeholder="City">

    <button onclick="searchDonors()">Search</button>

    <button onclick="getDonors()">Show All</button>

</div>

<h2>Available Donors</h2>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Blood Group</th>
        <th>City</th>
    </tr>
    </thead>

    <tbody id="donorList">
    </tbody>
</table>

<script>

    function getDonors() {

        fetch("/api/donors")
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }
                return response.json();
            })
            .then(data => displayDonors(data))
            .catch(error => {
                console.error("Error fetching donors:", error);
            });
    }

    function displayDonors(donors) {

        let table = document.getElementById("donorList");

        table.innerHTML = "";

        if (!donors || donors.length === 0) {
            table.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #777;">No donors found.</td></tr>';
            return;
        }

        donors.forEach(donor => {

            let bloodGroupName = (donor.bloodGroup && donor.bloodGroup.groupName) ? donor.bloodGroup.groupName : 'N/A';
            let ageDisplay = (donor.age !== undefined && donor.age !== null) ? donor.age : 'N/A';

            let row = `
                    <tr>
                        <td>${escapeHtml(donor.name || '')}</td>
                        <td>${ageDisplay}</td>
                        <td>${escapeHtml(bloodGroupName)}</td>
                        <td>${escapeHtml(donor.city || '')}</td>
                    </tr>
                `;

            table.innerHTML += row;

        });
    }

    function escapeHtml(text) {
        let div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    document.getElementById("donorForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let donor = {
            name: document.getElementById("name").value.trim(),
            age: parseInt(document.getElementById("age").value, 10),
            city: document.getElementById("city").value.trim(),
            bloodGroup: {
                groupName: document.getElementById("bloodGroup").value
            }
        };

        fetch("/api/donors", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(donor)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Registration failed with status " + response.status);
                }
                return response.json();
            })
            .then(() => {
                alert("Donor Registered Successfully!");
                document.getElementById("donorForm").reset();
                getDonors();
            })
            .catch(error => alert(error.message));

    });

    function searchDonors() {

        let group = document.getElementById("searchGroup").value.trim();
        let city = document.getElementById("searchCity").value.trim();

        let url = "";

        if (group !== "" && city !== "") {
            url = `/api/donors/search?groupName=${encodeURIComponent(group)}&city=${encodeURIComponent(city)}`;
        }
        else if (group !== "") {
            url = `/api/donors/blood-group/${encodeURIComponent(group)}`;
        }
        else if (city !== "") {
            url = `/api/donors/city/${encodeURIComponent(city)}`;
        }
        else {
            getDonors();
            return;
        }

        fetch(url)
            .then(response => response.json())
            .then(data => displayDonors(data))
            .catch(error => {
                console.error("Search failed:", error);
                alert("Search failed");
            });

    }

    getDonors();

</script>

</body>
</html>
